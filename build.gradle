buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // 8.5.2 ships the JdkImageTransform fallback that handles
        // android-34's bare `android` ModuleTarget — earlier AGPs
        // (incl. 8.2.0) crash jlink with "platformString missing
        // delimiter: android" on JBR 21. Requires Gradle 8.7+.
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.21'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
